spring:
  application:
    name: universal-data-tools
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/universal_importer}
    username: ${DB_USERNAME:importer}
    password: ${DB_PASSWORD:importer}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${TOOLBOX_MAX_FILE_SIZE:${IMPORTER_MAX_FILE_SIZE:20MB}}
      # Room for the multipart envelope around a file that is exactly at the limit.
      max-request-size: ${TOOLBOX_MAX_REQUEST_SIZE:${IMPORTER_MAX_REQUEST_SIZE:21MB}}

server:
  tomcat:
    # Read oversized uploads to the end so the client receives the 413 instead of a connection reset.
    max-swallow-size: -1

# Every value takes the TOOLBOX_* environment variable first, then the IMPORTER_* one of V0.1 (core-01 TD2).
toolbox:
  storage:
    dir: ${TOOLBOX_STORAGE_DIR:${IMPORTER_STORAGE_DIR:${java.io.tmpdir}/universal-importer}}
  importer:
    cleanup:
      # Deletes sessions not changed for session-ttl, with their files, and storage directories no session owns
      # (BE-F11). Every instance needs its own storage directory: a directory another database knows is an orphan here.
      enabled: true
      session-ttl: ${TOOLBOX_IMPORTER_SESSION_TTL:${IMPORTER_SESSION_TTL:24h}}
      interval: PT1H
  format:
    xlsx:
      # Zip bomb guard for uploaded workbooks (BE-F03 design X4). IMPORTER_* names are still honoured.
      max-uncompressed-size: ${TOOLBOX_XLSX_MAX_UNCOMPRESSED_SIZE:${IMPORTER_XLSX_MAX_UNCOMPRESSED_SIZE:200MB}}
      max-inflate-ratio: ${TOOLBOX_XLSX_MAX_INFLATE_RATIO:${IMPORTER_XLSX_MAX_INFLATE_RATIO:100}}
      max-entries: ${TOOLBOX_XLSX_MAX_ENTRIES:${IMPORTER_XLSX_MAX_ENTRIES:10000}}
