spring:
  application:
    name: api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/universal_importer}
    username: ${DB_USERNAME:importer}
    password: ${DB_PASSWORD:importer}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    async:
      # Exports stream from another thread; Tomcat's default async timeout (30s) would cut a slow download.
      request-timeout: 5m
  servlet:
    multipart:
      max-file-size: ${IMPORTER_MAX_FILE_SIZE:20MB}
      # Room for the multipart envelope around a file that is exactly at the limit.
      max-request-size: ${IMPORTER_MAX_REQUEST_SIZE:21MB}

server:
  tomcat:
    # Read oversized uploads to the end so the client receives the 413 instead of a connection reset.
    max-swallow-size: -1

importer:
  storage:
    dir: ${IMPORTER_STORAGE_DIR:${java.io.tmpdir}/universal-importer}
  xlsx:
    # Zip bomb guard for uploaded workbooks (BE-F03 design X4).
    max-uncompressed-size: ${IMPORTER_XLSX_MAX_UNCOMPRESSED_SIZE:200MB}
    max-inflate-ratio: ${IMPORTER_XLSX_MAX_INFLATE_RATIO:100}
    max-entries: ${IMPORTER_XLSX_MAX_ENTRIES:10000}
